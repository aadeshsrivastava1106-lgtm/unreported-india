<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unreported India | Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Special+Elite&display=swap">
<style>
  :root { --paper: #E7E3D6; --paper-alt: #DDD8C7; --ink: #22241F; --ink-soft: #5B5C50; --line: #C7C0A9; --teal: #2E6E63; --rust: #8B3A2B; --ochre: #A97323; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .headline-font { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; }
  .meta-mono { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; text-transform: uppercase; }
  header { background: var(--ink); color: var(--paper); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--ochre); }
  .disclaimer-strip { background: var(--rust); color: #fff; padding: 0.4rem 1.5rem; font-size: 0.7rem; text-transform: uppercase; font-family: 'IBM Plex Mono'; }
  main { flex: 1; display: grid; grid-template-columns: 420px 1fr; overflow: hidden; }
  .panel { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--line); }
  .panel-header { padding: 0.8rem 1.25rem; background: var(--paper-alt); border-bottom: 1px solid var(--line); font-family: 'Special Elite'; font-size: 0.85rem; }
  .scroll-area { flex: 1; overflow-y: auto; }
  .feed-item { padding: 1.5rem; border-bottom: 1px solid var(--line); cursor: pointer; transition: 0.2s; background: none; border: none; border-left: 6px solid transparent; width: 100%; text-align: left; }
  .feed-item.active { background: #fff; border-left-color: var(--teal); }
  .feed-item h3 { margin: 0.5rem 0; font-size: 1.4rem; line-height: 1.1; }
  .severity-meter { display: flex; gap: 3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rust); }
  .context-wrapper { padding: 2.5rem; max-width: 900px; }
  .official-card { background: #fff; border: 1px solid var(--line); border-top: 6px solid var(--ochre); padding: 2rem; position: relative; margin-bottom: 2.5rem; }
  .stamp { position: absolute; top: 15px; right: 15px; border: 2px solid var(--rust); color: var(--rust); font-family: 'Special Elite'; padding: 4px 10px; font-size: 0.75rem; transform: rotate(-3deg); }
  .gap-item { display: flex; gap: 1.5rem; margin-bottom: 1.8rem; }
  .redact-mark { width: 28px; height: 18px; background: var(--ink); flex-shrink: 0; }
  .loading-msg { padding: 4rem; text-align: center; font-family: 'IBM Plex Mono'; }
</style>
</head>
<body>
<header><div class="headline-font" style="font-size: 1.4rem;">UNREPORTED INDIA</div><div class="meta-mono">Real-Time Discrepancy Tracking</div></header>
<div class="disclaimer-strip">Warning: High discrepancy detected between field reports and government releases.</div>
<main>
  <section class="panel"><div class="panel-header">Field Reports</div><div class="scroll-area" id="feed-list"></div></section>
  <section class="panel" style="background: var(--paper-alt);"><div class="panel-header">Context Gap Analysis</div><div class="scroll-area" id="context-panel"></div></section>
</main>
<script>
  let reports = []; let activeId = null;
  async function load() {
    try {
      const res = await fetch('./news_feed.json?t=' + Date.now());
      reports = await res.json();
      if (reports.length > 0) { activeId = String(reports[0].id); render(); }
      else { document.getElementById('feed-list').innerHTML = '<div class="loading-msg">Feed is empty.</div>'; }
    } catch (e) { document.getElementById('feed-list').innerHTML = '<div class="loading-msg">Error loading feed.</div>'; }
  }
  function render() {
    document.getElementById('feed-list').innerHTML = reports.map(r => `
      <button class="feed-item ${String(r.id) === activeId ? 'active' : ''}" onclick="activeId='${r.id}';render()">
        <div style="display:flex; justify-content:space-between; align-items:center;"><span class="meta-mono">${r.date}</span>
        <div class="severity-meter">${Array(5).fill(0).map((_, i) => `<div class="dot" style="opacity:${i < r.severity ? 1 : 0.15}"></div>`).join('')}</div></div>
        <h3 class="headline-font">${r.headline}</h3><div class="meta-mono" style="color:var(--teal)">Source: ${r.reporter}</div>
      </button>`).join('');
    const s = reports.find(r => String(r.id) === activeId);
    if (s) {
      document.getElementById('context-panel').innerHTML = `
        <div class="context-wrapper">
          <div class="official-card"><div class="stamp">OFFICIAL RECORD</div><div class="meta-mono" style="margin-bottom:1rem;">Source: ${s.officialSource}</div>
          <p style="font-style:italic; font-size:1.15rem; line-height:1.6;">"${s.official}"</p></div>
          <div class="meta-mono" style="color:var(--rust); margin-bottom:1.5rem; font-weight:600;">Information Gaps Found</div>
          ${s.missing.map(m => `<div class="gap-item"><div class="redact-mark"></div><div style="font-size:1.1rem; line-height:1.4;">${m}</div></div>`).join('')}
          <div style="margin-top:4rem; padding-top:2rem; border-top:1px solid var(--line); color:var(--ink-soft); font-style:italic;">Summary: ${s.body}</div>
        </div>`;
    }
  }
  window.onload = load;
</script>
</body>
</html>
