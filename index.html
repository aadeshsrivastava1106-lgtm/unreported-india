<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unreported India | Accountabilty Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Special+Elite&display=swap">
<style>
  :root {
    --paper: #E7E3D6;
    --paper-alt: #DDD8C7;
    --ink: #22241F;
    --ink-soft: #5B5C50;
    --line: #C7C0A9;
    --teal: #2E6E63;
    --teal-dark: #1E4B43;
    --rust: #8B3A2B;
    --ochre: #A97323;
  }

  * { box-sizing: border-box; }
  
  body { 
    margin: 0; 
    background: var(--paper); 
    color: var(--ink); 
    font-family: 'IBM Plex Sans', sans-serif; 
    display: flex; 
    flex-direction: column; 
    height: 100vh; 
    overflow: hidden; 
  }

  .headline-font { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: -0.01em; }
  .meta-mono { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }

  header {
    background: var(--ink);
    color: var(--paper);
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid var(--ochre);
  }

  .masthead-title { font-family: 'Special Elite', monospace; font-size: 1.4rem; margin: 0; }

  .disclaimer-strip {
    background: var(--rust);
    color: #fff;
    padding: 0.4rem 1.5rem;
    font-size: 0.7rem;
    font-family: 'IBM Plex Mono';
    text-transform: uppercase;
  }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 420px 1fr;
    overflow: hidden;
  }

  .panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-left { border-right: 1px solid var(--line); }

  .panel-header {
    padding: 0.8rem 1.25rem;
    background: var(--paper-alt);
    border-bottom: 1px solid var(--line);
    font-family: 'Special Elite';
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .scroll-area {
    flex: 1;
    overflow-y: auto;
  }

  .feed-item {
    padding: 1.5rem;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.2s ease;
    background: none;
    border-left: 5px solid transparent;
    width: 100%;
    text-align: left;
  }

  .feed-item:hover { background: rgba(0,0,0,0.04); }
  .feed-item.active { background: #fff; border-left-color: var(--teal); }

  .feed-item h3 { margin: 0.5rem 0; font-size: 1.4rem; line-height: 1.1; }

  .severity-meter { margin-top: 0.5rem; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--rust); margin-right: 3px; }

  .context-wrapper { padding: 2rem; max-width: 800px; margin: 0 auto; }

  .official-card {
    background: #fff;
    border: 1px solid var(--line);
    border-top: 5px solid var(--ochre);
    padding: 2rem;
    margin-bottom: 2rem;
    position: relative;
    box-shadow: 2px 2px 0 var(--line);
  }

  .official-card .stamp {
    position: absolute;
    top: 15px;
    right: 15px;
    border: 2px solid var(--rust);
    color: var(--rust);
    font-family: 'Special Elite';
    padding: 4px 8px;
    font-size: 0.7rem;
    transform: rotate(-4deg);
    opacity: 0.8;
  }

  .missing-box { padding-left: 1rem; border-left: 2px dashed var(--rust); }
  .missing-point { display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: flex-start; }
  .redact-mark { width: 24px; height: 16px; background: var(--ink); flex-shrink: 0; margin-top: 4px; }

  .loading-msg { padding: 3rem; text-align: center; font-family: 'IBM Plex Mono'; color: var(--ink-soft); }
</style>
</head>
<body>

<header>
  <div class="masthead-title">UNREPORTED INDIA</div>
  <div class="meta-mono" id="status-bar">Ground Data vs. Official Record</div>
</header>

<div class="disclaimer-strip">
  Automated Comparison: Independent video transcripts checked against public government releases.
</div>

<main>
  <section class="panel panel-left">
    <div class="panel-header">The Field Reports</div>
    <div class="scroll-area" id="feed-list">
      <div class="loading-msg">Searching for news_feed.json...</div>
    </div>
  </section>

  <section class="panel panel-right" style="background: var(--paper-alt);">
    <div class="panel-header">Discrepancy Analysis</div>
    <div class="scroll-area" id="context-panel">
      <div class="loading-msg">Select a report to view context gaps.</div>
    </div>
  </section>
</main>

<script>
  let stories = [];
  let currentId = null;

  async function loadData() {
    const listContainer = document.getElementById('feed-list');
    try {
      const response = await fetch('./news_feed.json', { cache: 'no-store' });
      stories = await response.json();
      
      if (stories.length === 0) {
        listContainer.innerHTML = '<div class="loading-msg">Feed is empty. Scraper run required.</div>';
        return;
      }

      currentId = String(stories[0].id);
      renderUI();
    } catch (err) {
      console.error(err);
      listContainer.innerHTML = `<div class="loading-msg">Error: ${err.message}<br>news_feed.json not found.</div>`;
    }
  }

  function renderUI() {
    // Render Sidebar
    const list = document.getElementById('feed-list');
    list.innerHTML = stories.map(s => `
      <button class="feed-item ${String(s.id) === currentId ? 'active' : ''}" onclick="changeStory('${s.id}')">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="meta-mono">${s.date} | ${s.location}</span>
          <div class="severity-meter">
            ${Array(5).fill(0).map((_, i) => `<span class="dot" style="opacity: ${i < s.severity ? 1 : 0.15}"></span>`).join('')}
          </div>
        </div>
        <h3 class="headline-font">${s.headline}</h3>
        <div class="meta-mono" style="color: var(--teal-dark)">Source: ${s.reporter}</div>
      </button>
    `).join('');

    // Render Context
    const story = stories.find(s => String(s.id) === currentId);
    const context = document.getElementById('context-panel');

    if (story) {
      context.innerHTML = `
        <div class="context-wrapper">
          <div class="official-card">
            <div class="stamp">Official Release</div>
            <div class="meta-mono" style="margin-bottom: 1rem; color: var(--ochre)">${story.officialSource}</div>
            <p style="font-style: italic; line-height: 1.6; font-size: 1.1rem; color: var(--ink);">
              "${story.official}"
            </p>
          </div>

          <div class="meta-mono" style="color: var(--rust); margin-bottom: 1.5rem; font-weight: 600;">
            The Discrepancy (Missing Context)
          </div>

          <div class="missing-box">
            ${story.missing.map(m => `
              <div class="missing-point">
                <div class="redact-mark"></div>
                <div style="font-size: 1rem; line-height: 1.5;">${m}</div>
              </div>
            `).join('')}
          </div>
          
          <div style="margin-top: 3rem; font-size: 0.8rem; color: var(--ink-soft); font-family: 'IBM Plex Mono';">
            Independent Narrative: ${story.body}
          </div>
        </div>
      `;
    }
  }

  function changeStory(id) {
    currentId = String(id);
    renderUI();
  }

  loadData();
</script>
</body>
</html>
