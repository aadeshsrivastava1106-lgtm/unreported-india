<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unreported India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Special+Elite&display=swap">
<style>
  :root {
    --paper: #E7E3D6; --paper-alt: #DDD8C7; --ink: #22241F;
    --ink-soft: #5B5C50; --line: #C7C0A9; --teal: #2E6E63;
    --teal-dark: #1E4B43; --rust: #8B3A2B; --ochre: #A97323;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .headline-font { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; }
  .meta-mono { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; text-transform: uppercase; }
  
  header { background: var(--ink); color: var(--paper); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
  .masthead-title { font-family: 'Special Elite', monospace; font-size: 1.2rem; margin: 0; }
  
  .disclaimer { background: var(--ochre); color: #fff; padding: 0.4rem 1.5rem; font-size: 0.75rem; font-family: 'IBM Plex Mono'; }
  
  main { flex: 1; display: grid; grid-template-columns: 400px 1fr; overflow: hidden; }
  .panel { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--line); }
  .panel-header { padding: 0.75rem 1.25rem; background: var(--paper-alt); border-bottom: 1px solid var(--line); font-family: 'Special Elite'; font-size: 0.8rem; }
  .scroll-area { flex: 1; overflow-y: auto; }
  
  .feed-item { padding: 1.25rem; border-bottom: 1px solid var(--line); cursor: pointer; transition: 0.2s; background: none; border-left: 4px solid transparent; width: 100%; text-align: left; }
  .feed-item:hover { background: rgba(0,0,0,0.03); }
  .feed-item.active { background: #fff; border-left-color: var(--teal); }
  .feed-item h3 { margin: 0.5rem 0; font-size: 1.2rem; line-height: 1.2; }
  
  .severity-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--rust); margin-right: 2px; }

  .official-box { background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--ochre); margin: 1.5rem; padding: 1.5rem; position: relative; }
  .stamp { position: absolute; top: 10px; right: 10px; border: 2px solid var(--rust); color: var(--rust); font-family: 'Special Elite'; padding: 2px 5px; font-size: 0.6rem; transform: rotate(-5deg); }
  .missing-section { padding: 0 1.5rem 1.5rem; }
  .missing-item { display: flex; gap: 1rem; margin-bottom: 1rem; }
  .redaction { width: 20px; height: 14px; background: var(--ink); flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <p class="masthead-title">UNREPORTED INDIA</p>
  <div class="meta-mono">Case file: Balaghat Crisis</div>
</header>

<div class="disclaimer">Independent reports matched against official government record</div>

<main>
  <section class="panel">
    <div class="panel-header">The Independent Feed</div>
    <div class="scroll-area" id="feed-list"></div>
  </section>

  <section class="panel" style="background: var(--paper-alt);">
    <div class="panel-header">Context & Discrepancies</div>
    <div class="scroll-area" id="context-panel"></div>
  </section>
</main>

<script>
  let feed = [];
  let selectedId = null;

  async function loadFeed() {
    try {
      const res = await fetch('./news_feed.json', { cache: 'no-store' });
      feed = await res.json();
      if (feed.length > 0) {
        selectedId = String(feed[0].id);
        render();
      }
    } catch (e) {
      document.getElementById('feed-list').innerHTML = '<div style="padding:20px">No feed available.</div>';
    }
  }

  function render() {
    const list = document.getElementById('feed-list');
    list.innerHTML = feed.map(item => `
      <button class="feed-item ${String(item.id) === selectedId ? 'active' : ''}" onclick="selectStory('${item.id}')">
        <div style="display:flex; justify-content:space-between">
          <span class="meta-mono">${item.date}</span>
          <div>${Array(5).fill(0).map((_, i) => `<span class="severity-dot" style="opacity:${i < item.severity ? 1 : 0.2}"></span>`).join('')}</div>
        </div>
        <h3 class="headline-font">${item.headline}</h3>
        <div class="meta-mono" style="color:var(--teal)">${item.reporter}</div>
      </button>
    `).join('');

    const activeItem = feed.find(i => String(i.id) === selectedId);
    const context = document.getElementById('context-panel');
    if (activeItem) {
      context.innerHTML = `
        <div class="official-box">
          <div class="stamp">OFFICIAL RECORD</div>
          <div class="meta-mono" style="margin-bottom:10px">${activeItem.officialSource}</div>
          <p style="font-style:italic; margin:0">"${activeItem.official}"</p>
        </div>
        <div class="missing-section">
          <div class="meta-mono" style="color:var(--rust); margin-bottom:1rem">Discrepancies Found</div>
          ${activeItem.missing.map(m => `
            <div class="missing-item">
              <div class="redaction"></div>
              <div style="line-height:1.4">${m}</div>
            </div>
          `).join('')}
        </div>
      `;
    }
  }

  function selectStory(id) {
    selectedId = String(id);
    render();
  }

  window.onload = loadFeed;
</script>
</body>
</html>
