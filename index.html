<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unreported India | Accountability Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Special+Elite&display=swap">
<style>
  :root {
    --paper: #E7E3D6;
    --paper-alt: #DDD8C7;
    --ink: #22241F;
    --ink-soft: #5B5C50;
    --line: #C7C0A9;
    --teal: #2E6E63;
    --teal-dark: #1E4B43;
    --rust: #8B3A2B;
    --ochre: #A97323;
  }

  * { box-sizing: border-box; }
  
  body { 
    margin: 0; 
    background: var(--paper); 
    color: var(--ink); 
    font-family: 'IBM Plex Sans', sans-serif; 
    display: flex; 
    flex-direction: column; 
    height: 100vh; 
    overflow: hidden; 
  }

  .headline-font { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: -0.01em; }
  .meta-mono { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }

  header {
    background: var(--ink);
    color: var(--paper);
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid var(--ochre);
  }

  .masthead-title { font-family: 'Special Elite', monospace; font-size: 1.4rem; margin: 0; }

  .disclaimer-strip {
    background: var(--rust);
    color: #fff;
    padding: 0.4rem 1.5rem;
    font-size: 0.7rem;
    font-family: 'IBM Plex Mono';
    text-transform: uppercase;
  }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 420px 1fr;
    overflow: hidden;
  }

  .panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-left { border-right: 1px solid var(--line); }

  .panel-header {
    padding: 0.8rem 1.25rem;
    background: var(--paper-alt);
    border-bottom: 1px solid var(--line);
    font-family: 'Special Elite';
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .scroll-area {
    flex: 1;
    overflow-y: auto;
  }

  /* Feed Items */
  .feed-item {
    padding: 1.5rem;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.2s ease;
    background: none;
    border: none;
    border-left: 6px solid transparent;
    width: 100%;
    text-align: left;
    display: block;
  }

  .feed-item:hover { background: rgba(0,0,0,0.04); }
  .feed-item.active { background: #fff; border-left-color: var(--teal); }

  .feed-item h3 { 
    margin: 0.5rem 0; 
    font-size: 1.4rem; 
    line-height: 1.1; 
    color: var(--ink);
  }

  .severity-meter { display: flex; gap: 3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rust); }

  /* Context Detail View */
  .context-wrapper { padding: 2.5rem; max-width: 900px; }

  .official-card {
    background: #fff;
    border: 1px solid var(--line);
    border-top: 6px solid var(--ochre);
    padding: 2rem;
    margin-bottom: 2.5rem;
    position: relative;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.05);
  }

  .official-card .stamp {
    position: absolute;
    top: 15px;
    right: 15px;
    border: 2px solid var(--rust);
    color: var(--rust);
    font-family: 'Special Elite';
    padding: 4px 10px;
    font-size: 0.75rem;
    transform: rotate(-3deg);
    font-weight: bold;
  }

  .missing-section-title {
    color: var(--rust);
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.5rem;
    font-weight: 600;
  }

  .gap-list { list-style: none; padding: 0; margin: 0; }
  .gap-item { display: flex; gap: 1.5rem; margin-bottom: 1.8rem; align-items: flex-start; }
  .redact-mark { width: 28px; height: 18px; background: var(--ink); flex-shrink: 0; margin-top: 4px; }
  .gap-text { font-size: 1.1rem; line-height: 1.5; color: var(--ink); }

  .narrative-box {
    margin-top: 4rem;
    padding-top: 2rem;
    border-top: 1px solid var(--line);
    font-style: italic;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  .loading-msg { padding: 4rem; text-align: center; font-family: 'IBM Plex Mono'; color: var(--ink-soft); }
</style>
</head>
<body>

<header>
  <div class="masthead-title">UNREPORTED INDIA</div>
  <div class="meta-mono" id="status-bar">Ground Truth vs. Press Release</div>
</header>

<div class="disclaimer-strip">
  CRITICAL DISCREPANCY TRACKER: Comparing AI-Analyzed video transcripts against District Administration data.
</div>

<main>
  <!-- Sidebar Feed -->
  <section class="panel panel-left">
    <div class="panel-header">Documented Field Reports</div>
    <div class="scroll-area" id="feed-list">
      <div class="loading-msg">Loading news_feed.json...</div>
    </div>
  </section>

  <!-- Content Detail -->
  <section class="panel panel-right" style="background: var(--paper-alt);">
    <div class="panel-header">Contextual Gap Analysis</div>
    <div class="scroll-area" id="context-panel">
      <div class="loading-msg">Select a report to analyze discrepancies.</div>
    </div>
  </section>
</main>

<script>
  let reports = [];
  let activeId = null;

  async function fetchData() {
    const listEl = document.getElementById('feed-list');
    try {
      // Fetch with cache busting to see live changes
      const response = await fetch('./news_feed.json?v=' + Date.now(), { cache: 'no-store' });
      reports = await response.json();
      
      if (!reports || reports.length === 0) {
        listEl.innerHTML = '<div class="loading-msg">Feed is currently empty. Run scraper.py to generate entries.</div>';
        return;
      }

      activeId = String(reports[0].id);
      renderAll();
    } catch (err) {
      console.error("Fetch Error:", err);
      listEl.innerHTML = `<div class="loading-msg">Error loading data: ${err.message}<br>Ensure news_feed.json exists in the root folder.</div>`;
    }
  }

  function renderAll() {
    // 1. Render the Sidebar
    const listEl = document.getElementById('feed-list');
    listEl.innerHTML = reports.map(item => `
      <button class="feed-item ${String(item.id) === activeId ? 'active' : ''}" onclick="selectReport('${item.id}')">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
          <span class="meta-mono">${item.date} | ${item.location}</span>
          <div class="severity-meter">
            ${Array(5).fill(0).map((_, i) => `
              <div class="dot" style="opacity: ${i < item.severity ? 1 : 0.15}"></div>
            `).join('')}
          </div>
        </div>
        <h3 class="headline-font">${item.headline}</h3>
        <div class="meta-mono" style="color: var(--teal-dark)">Reported by: ${item.reporter}</div>
      </button>
    `).join('');

    // 2. Render the Detail View
    const detailEl = document.getElementById('context-panel');
    const selected = reports.find(r => String(r.id) === activeId);

    if (selected) {
      detailEl.innerHTML = `
        <div class="context-wrapper">
          <div class="official-card">
            <div class="stamp">Official Account</div>
            <div class="meta-mono" style="margin-bottom: 1rem; color: var(--ochre)">Source: ${selected.officialSource}</div>
            <p style="font-style: italic; line-height: 1.6; font-size: 1.15rem; color: var(--ink); margin:0;">
              "${selected.official}"
            </p>
          </div>

          <div class="meta-mono missing-section-title">
            Information Gaps Found in Official Record
          </div>

          <div class="gap-list">
            ${selected.missing.map(gap => `
              <div class="gap-item">
                <div class="redact-mark"></div>
                <div class="gap-text">${gap}</div>
              </div>
            `).join('')}
          </div>
          
          <div class="narrative-box">
            <div class="meta-mono" style="margin-bottom:0.5rem">Field Summary</div>
            ${selected.body}
          </div>
        </div>
      `;
    }
  }

  function selectReport(id) {
    activeId = String(id);
    renderAll();
  }

  // Run on load
  window.onload = fetchData;
</script>
</body>
</html>
